pipeline:
  identifier: Build_mylon810_repo_template_1778281347039
  name: Build repo-template
  orgIdentifier: default
  projectIdentifier: default_project
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: account.Github_OAuth_1778281078846
        repoName: mylon810/repo-template
  stages:
    - stage:
        identifier: build
        name: build
        spec:
          caching:
            enabled: true
          cloneCodebase: true
          execution:
            steps:
              - step:
                  identifier: installdependencies
                  name: install dependencies
                  spec:
                    command: npm install
                  timeout: ""
                  type: Run
              - step:
                  type: Run
                  name: news-test
                  identifier: newstest
                  spec:
                    shell: Sh
                    command: |-
                      import requests

                      # 抓取 Hacker News 科技头条
                      print("--- 正在获取今日头条报告 ---")
                      url = 'https://node-hnapi.herokuapp.com/news?page=1'
                      try:
                          response = requests.get(url)
                          news_list = response.json()
                          for i, item in enumerate(news_list[:5]):
                              print(f"{i+1}. {item['title']}")
                              print(f"   链接: {item['url']}")
                      except Exception as e:
                          print(f"抓取失败: {e}")
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
        type: CI
